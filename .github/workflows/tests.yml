name: Run Tests

on:
  push:
    branches: ["**"] # runs on all branches
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-suffix: tests
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Java (for ANTLR)
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install dependencies
        run: uv sync --locked --python 3.10 --group dev

      - name: Download ANTLR
        run: |
          wget https://www.antlr.org/download/antlr-4.13.2-complete.jar -O /tmp/antlr-4.13.2-complete.jar

      - name: Generate parser files
        run: |
          cd src
          java -jar /tmp/antlr-4.13.2-complete.jar -no-listener -visitor -Dlanguage=Python3 Kafe_Grammar.g4

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit

      - name: Run Ruff
        run: uv run --locked --group dev ruff check src tests

      - name: Run basedpyright
        run: uv run --locked --group dev basedpyright

      - name: Run codespell
        run: uv run --locked --group dev codespell

      - name: Check Python quality policy
        run: uv run --locked --group dev python scripts/check_quality_policy.py

      - name: Run tests
        run: >-
          uv run --locked --python 3.10 --group dev pytest tests/ -v
          --cov="${GITHUB_WORKSPACE}/src"
          --cov-config="${GITHUB_WORKSPACE}/pyproject.toml"
          --cov-report=term-missing
          --cov-fail-under=80
