name: VS Code Extension Validation

on:
  push:
    paths:
      - 'kafe-vscode/**'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'kafe-vscode/**'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Preserve real macOS 26 checks on Intel after repeated hosted ARM capacity failures.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kafe-vscode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify macOS host architecture
        if: matrix.os == 'macos-26-intel'
        run: |
          sw_vers
          node -e "const assert = require('node:assert/strict'); console.log(process.platform, process.arch); assert.equal(process.platform, 'darwin'); assert.equal(process.arch, 'x64');"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Mocha 11 currently brings glob 10's upstream deprecation notice; no log filtering or audit exception.
      - run: npm ci
      - name: Audit extension dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=low
      - run: npm run references:check
      - run: npm run test:unit

  windows-extension:
    needs: unit
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kafe-vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: node test/provision-vscode.js
      - run: npm run test:extension
      - run: npx vsce package --out "$env:RUNNER_TEMP\kafe-neural-suite.vsix"
      - run: node test/verify-vsix.js "$env:RUNNER_TEMP\kafe-neural-suite.vsix"

  reference-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.3'
      - run: uv sync --locked --group dev
      - name: Generate the matching ANTLR parser
        run: |
          curl --fail --location https://www.antlr.org/download/antlr-4.13.2-complete.jar --output "$RUNNER_TEMP/antlr.jar"
          KAFE_TARGET_REVISION=$(node -p "require('./kafe-vscode/src/runtimeManifest.json').runtime.sourceRevision")
          mkdir -p "$RUNNER_TEMP/kafe-reference-runtime"
          git archive "$KAFE_TARGET_REVISION" src | tar -x -C "$RUNNER_TEMP/kafe-reference-runtime"
          (cd "$RUNNER_TEMP/kafe-reference-runtime/src" && java -jar "$RUNNER_TEMP/antlr.jar" -no-listener -visitor -Dlanguage=Python3 Kafe_Grammar.g4)
          cd src
          java -jar "$RUNNER_TEMP/antlr.jar" -no-listener -visitor -Dlanguage=Python3 Kafe_Grammar.g4
      - run: KAFE_REFERENCE_RUNTIME_ROOT="$RUNNER_TEMP/kafe-reference-runtime" uv run --locked --group dev python kafe-vscode/scripts/verify-tutor-references.py
      - run: KAFE_REFERENCE_RUNTIME_ROOT="$RUNNER_TEMP/kafe-reference-runtime" uv run --locked --group dev python kafe-vscode/scripts/verify-library-references.py
      - run: uv run --locked --group dev pytest tests/test_tutor_references.py tests/test_tutor_reference_verifier.py tests/test_tutor_library_references.py -q

  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kafe-vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare isolated browser tooling
        run: |
          # Hosted Ubuntu already includes Chrome and its system libraries.
          # Avoid external system/browser setup while preserving all rendered checks.
          if ! browser_path="$(command -v google-chrome)"; then
            echo "::error::The runner image must provide Google Chrome for layout checks."
            exit 1
          fi
          test -x "$browser_path"
          "$browser_path" --version
          echo "KAFE_LAYOUT_BROWSER=$browser_path" >> "$GITHUB_ENV"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/kafe-layout" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Check rendered conversation layout
        run: KAFE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/kafe-layout/node_modules/playwright" npm run test:layout
