name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install dependencies
        run: uv sync --locked --python 3.10 --group docs --no-dev

      - name: Deploy to GitHub Pages
        env:
          # Material emits this upstream warning for MkDocs 2.0; keep suppression limited to this deployment command.
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --locked --python 3.10 --group docs --no-dev mkdocs gh-deploy --force
