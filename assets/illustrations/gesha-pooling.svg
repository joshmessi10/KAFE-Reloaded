.ill-pool-q1 { animation: ill-pool-q1 12s linear infinite; }
@keyframes ill-pool-q2 { 0%,42% { opacity: 0 } 48%,100% { opacity: 1 } }
.ill-pool-q2 { animation: ill-pool-q2 12s linear infinite; }
@keyframes ill-pool-q3 { 0%,58% { opacity: 0 } 64%,100% { opacity: 1 } }
.ill-pool-q3 { animation: ill-pool-q3 12s linear infinite; }
@keyframes ill-pool-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-pool-all { animation: ill-pool-all 12s linear infinite; }
.ill-pool-dash { stroke-dasharray: 6 5; }
</style>
