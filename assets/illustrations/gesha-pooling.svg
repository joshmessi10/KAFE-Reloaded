<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-pool-t ill-pool-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-pool-t">Max pooling se queda con el mayor de cada bloque / Max pooling keeps the largest of each block</title>
<desc id="ill-pool-d">A 4 by 4 image split into four 2 by 2 blocks. In each block the largest number lights up, 4, 2, 2 and 8, and is copied into a 2 by 2 output: the image keeps its strongest signals at half the size.</desc>
<style>
