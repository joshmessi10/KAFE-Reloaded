<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-lgr-t ill-lgr-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-lgr-t">La curva en S convierte horas en probabilidad / The S curve turns hours into a probability</title>
<desc id="ill-lgr-d">Students who studied 1 to 3 hours failed (bottom) and 4 to 6 hours passed (top). An S-shaped curve draws itself from 0 to 1, a dashed line marks one half, and a probe at 3.5 hours reads a probability of 0.54.</desc>
