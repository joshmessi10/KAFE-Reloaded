.ill-lgr-curve { stroke-dasharray: 516; animation: ill-lgr-draw 10s ease-in-out infinite; }
@keyframes ill-lgr-half { 0%,45% { opacity: 0 } 55%,100% { opacity: 1 } }
.ill-lgr-half { animation: ill-lgr-half 10s linear infinite; }
@keyframes ill-lgr-probe { 0%,60% { opacity: 0 } 70%,100% { opacity: 1 } }
.ill-lgr-probe { animation: ill-lgr-probe 10s linear infinite; }
.ill-lgr-dash { stroke-dasharray: 6 6; }
@keyframes ill-lgr-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-lgr-all { animation: ill-lgr-all 10s linear infinite; }
</style>
