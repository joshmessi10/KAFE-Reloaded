<svg viewBox="0 0 520 220" role="img" aria-labelledby="ill-exp-t ill-exp-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-exp-t">e como suma de pedacitos / e as a sum of small pieces</title>
<desc id="ill-exp-d">Bars of length 1, 1, 1/2, 1/6, 1/24 and smaller appear one after another in a row. Together they reach 2.718, the number e.</desc>
<style>
@keyframes ill-exp-grow { 0% { transform: scaleX(0); opacity: 0 } 8%,90% { transform: scaleX(1); opacity: 1 } 100% { opacity: 0 } }
[class^="ill-exp-"] { transform-box: fill-box; transform-origin: 0 50%; }
.ill-exp-0 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 0.0s; }
.ill-exp-1 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 0.6s; }
.ill-exp-2 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 1.2s; }
.ill-exp-3 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 1.8s; }
.ill-exp-4 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 2.4s; }
.ill-exp-5 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 3.0s; }
.ill-exp-6 { animation: ill-exp-grow 8s ease-out infinite; animation-delay: 3.6s; }
</style>
<path class="k-thin" d="M40 80 V190"/><text x="34" y="70">0</text>
<path class="k-accent-line" d="M447.7 80 V190" stroke-dasharray="5 5"/>
<text class="k-label" x="417.7" y="70">e ≈ 2.718</text>
