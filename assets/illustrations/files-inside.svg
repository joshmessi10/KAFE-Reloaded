<svg viewBox="0 0 600 250" role="img" aria-labelledby="ill-fin-t ill-fin-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-fin-t">files.read("a.txt") → os.path.join → open → STR</title>
<desc id="ill-fin-d">Step 1: the program calls files.read with a file name. Step 2: KAFE joins the folder of the .kf program with that name to build the full path. Step 3: Python opens the file at that path and reads it. Step 4: the text comes back to the program as a STR.</desc>
