<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-std-t ill-std-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-std-t">StandardScaler centra en 0 y mide en desviaciones / StandardScaler centres on 0 and measures in deviations</title>
<desc id="ill-std-d">Pet weights 7, 9, 9 and 15 kilograms on a top ruler. They slide down to a bottom ruler measured in standard deviations: the average, 10, lands on 0, and the points land on −1, −0.33, −0.33 and 1.67.</desc>
<style>
@keyframes ill-std-m0 { 0%,20% { transform: translate(-40.0px, 140.0px) } 60%,100% { transform: translate(0, 0) } }
.ill-std-m0 { animation: ill-std-m0 10s ease-in-out infinite; }
@keyframes ill-std-m1 { 0%,20% { transform: translate(-33.3px, 140.0px) } 60%,100% { transform: translate(0, 0) } }
.ill-std-m1 { animation: ill-std-m1 10s ease-in-out infinite; }
@keyframes ill-std-m2 { 0%,20% { transform: translate(-33.3px, 124.0px) } 60%,100% { transform: translate(0, 0) } }
.ill-std-m2 { animation: ill-std-m2 10s ease-in-out infinite; }
@keyframes ill-std-m3 { 0%,20% { transform: translate(-13.3px, 140.0px) } 60%,100% { transform: translate(0, 0) } }
.ill-std-m3 { animation: ill-std-m3 10s ease-in-out infinite; }
@keyframes ill-std-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-std-all { animation: ill-std-all 10s linear infinite; }
.ill-std-dash { stroke-dasharray: 6 5; }
</style>
<text class="k-label" x="20" y="64">kg</text><path class="k-line" d="M100 70 H560"/><text class="k-label" x="20" y="204">z</text><path class="k-line" d="M100 210 H560"/><text x="92" y="92">5</text><text x="292" y="92">10</text><text x="492" y="92">15</text><text x="100" y="232">-2</text><text x="210" y="232">-1</text><text x="320" y="232">0</text><text x="430" y="232">1</text><text x="540" y="232">2</text>
<g class="ill-std-all"><line class="k-thin ill-std-dash" x1="300" y1="60" x2="330" y2="220"/><circle class="k-accent ill-std-m0" cx="220" cy="198" r="8"/><circle class="k-accent ill-std-m1" cx="293.3333333333333" cy="198" r="8"/><circle class="k-accent ill-std-m2" cx="293.3333333333333" cy="182" r="8"/><circle class="k-accent ill-std-m3" cx="513.3333333333334" cy="198" r="8"/></g>
</svg>
