<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-ohe-t ill-ohe-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-ohe-t">OneHotEncoder abre una columna por categoría / OneHotEncoder opens one column per category</title>
<desc id="ill-ohe-d">A pet column with cat, dog, fish and cat. Three new columns appear, pet_cat, pet_dog and pet_fish, and each row lights up a 1 in the column of its pet and 0 in the others.</desc>
