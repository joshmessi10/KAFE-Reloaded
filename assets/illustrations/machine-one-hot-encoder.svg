@keyframes ill-ohe-r2 { 0%,51% { opacity: 0 } 57%,100% { opacity: 1 } }
.ill-ohe-r2 { animation: ill-ohe-r2 10s linear infinite; }
@keyframes ill-ohe-r3 { 0%,59% { opacity: 0 } 65%,100% { opacity: 1 } }
.ill-ohe-r3 { animation: ill-ohe-r3 10s linear infinite; }
@keyframes ill-ohe-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-ohe-all { animation: ill-ohe-all 10s linear infinite; }
.ill-ohe-dash { stroke-dasharray: 6 5; }
</style>
<text class="k-label" x="60" y="34">pet</text><g class="ill-ohe-all">
