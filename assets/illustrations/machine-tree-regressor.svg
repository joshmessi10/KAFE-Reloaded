<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-dtr-t ill-dtr-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-dtr-t">El árbol de regresión predice con escalones / The regression tree predicts with steps</title>
<desc id="ill-dtr-d">Ice-cream sales by temperature. First a flat line at the overall average, 37.2. Then the tree cuts at 21.5 degrees and the line becomes two steps: 21 on the cold side and 48 on the warm side.</desc>
<style>
@keyframes ill-dtr-flat { 0%,30% { opacity: 1 } 40%,100% { opacity: 0 } }
.ill-dtr-flat { opacity: 0; animation: ill-dtr-flat 10s linear infinite; }
@keyframes ill-dtr-steps { 0%,40% { opacity: 0 } 50%,100% { opacity: 1 } }
.ill-dtr-steps { animation: ill-dtr-steps 10s linear infinite; }
.ill-dtr-dash { stroke-dasharray: 6 5; }
@keyframes ill-dtr-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-dtr-all { animation: ill-dtr-all 10s linear infinite; }
</style>
<path class="k-line" d="M60 20 V230 H500"/>
<text x="142" y="252">15</text><text x="196" y="252">18</text><text x="322" y="252">25</text><text x="376" y="252">28</text><text x="448" y="252">32</text>
<g class="ill-dtr-all">
<g class="ill-dtr-flat"><line class="k-accent-line" x1="80" y1="118.39999999999999" x2="490" y2="118.39999999999999"/><text class="k-label" x="495" y="123.39999999999999">37.2</text></g>
<g class="ill-dtr-steps"><path class="k-accent-line" d="M80 167 H267.0 V86 H490"/><line class="k-thin ill-dtr-dash" x1="267.0" y1="30" x2="267.0" y2="230"/><text class="k-label" x="237.0" y="26">21.5</text><text class="k-label" x="90" y="155">21</text><text class="k-label" x="495" y="91">48</text></g>
<circle class="k-fill" cx="150" cy="170" r="7"/><circle class="k-fill" cx="204" cy="164" r="7"/><circle class="k-fill" cx="330" cy="110" r="7"/><circle class="k-fill" cx="384" cy="98" r="7"/><circle class="k-fill" cx="456" cy="50" r="7"/>
</g>
</svg>
