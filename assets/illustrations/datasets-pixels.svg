<title id="ill-dpx-t">Una imagen es una cuadrícula de números / A picture is a grid of numbers</title>
<desc id="ill-dpx-d">A tiny 5 by 5 picture of a heart. Each lit square becomes the number 1 and each empty square becomes 0, giving a 5 by 5 grid of numbers.</desc>
