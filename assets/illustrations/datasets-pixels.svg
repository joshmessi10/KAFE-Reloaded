.ill-dpx-pic { animation: ill-dpx-pic 9s ease-out infinite; }
.ill-dpx-arrow { stroke-dasharray: 120; animation: ill-dpx-arrow 9s ease-in-out infinite; }
.ill-dpx-r0 { animation: ill-dpx-r0 9s linear infinite; }
.ill-dpx-r1 { animation: ill-dpx-r1 9s linear infinite; }
