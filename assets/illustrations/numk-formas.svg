@keyframes ill-nkf-c { 0%,50% { opacity: 0; transform: translateY(12px) } 60%,92% { opacity: 1; transform: translateY(0) } 100% { opacity: 0 } }
.ill-nkf-a { animation: ill-nkf-a 8s ease-out infinite; }
.ill-nkf-b { animation: ill-nkf-b 8s ease-out infinite; }
.ill-nkf-c { animation: ill-nkf-c 8s ease-out infinite; }
</style>
