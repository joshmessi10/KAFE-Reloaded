<svg viewBox="0 0 560 230" role="img" aria-labelledby="ill-nkf-t ill-nkf-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-nkf-t">Vector, matriz y tensor / Vector, matrix and tensor</title>
<desc id="ill-nkf-d">A vector is one row of three numbers with shape (3,). A matrix is a table of two rows and three columns with shape (2, 3). A tensor is a stack of three small 2 by 2 tables, like the red, green and blue layers of a picture, with shape (3, 2, 2). They appear one after another.</desc>
