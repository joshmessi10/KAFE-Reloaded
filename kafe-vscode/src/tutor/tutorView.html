<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP_SOURCE}}; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}';">
  <title>KAFE Tutor</title>
  <link rel="stylesheet" href="{{STYLE_URI}}">
</head>
<body>
  <main id="tutor">
    <div id="timeline" role="log" aria-label="Tutor conversation" aria-live="off" tabindex="0"></div>
    <div id="response-dock" class="response-dock" data-state="idle" aria-busy="false">
      <span id="response-state"></span>
      <button id="new-content" type="button" hidden>Go to latest</button>
    </div>
    <p id="conversation-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <form id="composer-form" class="composer-form">
      <div id="context-row" class="context-row" aria-label="Whole files included in request">
        <span id="active-context"></span>
        <div id="included-context"></div>
      </div>
      <label for="composer" class="sr-only">Message to KAFE Tutor</label>
      <textarea id="composer" rows="2" aria-describedby="composer-help" placeholder="Ask a question or describe what you want to build."></textarea>
      <p id="composer-help" class="sr-only">Enter to send. Shift+Enter for a new line.</p>
      <div class="composer-controls">
        <button id="guided-learning" class="quiet-control" type="button" aria-label="Choose learning level. Current level: Beginner." title="Choose learning level. Current level: Beginner.">Beginner</button>
        <div class="submit-controls">
          <button id="add-context" class="quiet-control" type="button" aria-expanded="false" aria-controls="context-selector" hidden>Add context</button>
          <button id="stop" type="button" aria-label="Stop the current response" hidden>Stop</button>
          <button id="send" type="submit" aria-label="Send message to KAFE Tutor" disabled>Send</button>
        </div>
      </div>
      <details id="context-selector" hidden>
        <summary>Available whole files</summary>
        <p class="context-note">File contents enter the request only after inclusion. The active KAFE file is included by default.</p>
        <div id="context-sources"></div>
      </details>
      <button id="context-run" class="quiet-control" type="button" hidden></button>
    </form>
  </main>
  <script id="initial-state" type="application/json" nonce="{{NONCE}}">{{INITIAL_STATE}}</script>
  <script nonce="{{NONCE}}" src="{{TIMELINE_URI}}"></script>
  <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
