<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP_SOURCE}}; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}';">
  <title>KAFE Tutor</title>
  <link rel="stylesheet" href="{{STYLE_URI}}">
</head>
<body>
  <main id="tutor">
    <div id="timeline" role="log" aria-label="Tutor conversation" aria-live="off" tabindex="0"></div>
    <button id="new-content" type="button" hidden>Go to latest</button>
    <p id="conversation-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <form id="composer-form" class="composer-form">
      <div id="context-row" class="context-row" aria-label="Request context">
        <span id="active-context"></span>
        <details id="context-selector" hidden>
          <summary>Other files</summary>
          <div id="context-sources"></div>
        </details>
        <button id="context-run" type="button" hidden></button>
      </div>
      <label for="composer" class="sr-only">Message to KAFE Tutor</label>
      <textarea id="composer" rows="3" aria-describedby="composer-help" placeholder="Ask a question or describe what you want to build."></textarea>
      <div class="composer-controls">
        <p id="composer-help">Enter to send. Shift+Enter for a new line.</p>
        <button id="stop" type="button" aria-label="Stop the current response" hidden>Stop</button>
        <button id="send" type="submit" aria-label="Send message to KAFE Tutor" disabled>Send</button>
      </div>
    </form>
  </main>
  <script id="initial-state" type="application/json" nonce="{{NONCE}}">{{INITIAL_STATE}}</script>
  <script nonce="{{NONCE}}" src="{{TIMELINE_URI}}"></script>
  <script nonce="{{NONCE}}" src="{{SCRIPT_URI}}"></script>
</body>
</html>
