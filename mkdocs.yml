site_name: KAFE
site_description: Aprende a programar, Machine Learning y redes neuronales con KAFE, paso a paso.
site_url: https://joshmessi10.github.io/KAFE-Reloaded/
repo_url: https://github.com/joshmessi10/KAFE-Reloaded
repo_name: KAFE-Reloaded

theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/images/kafe-logo-horizontal.png
  favicon: assets/images/favicon.png
  palette:
    # Colors come from the KAFE Reloaded logo and are defined in custom.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Inicio: index.md
  - Aprende:
      - aprende/index.md
      - ¿Qué es programar?: aprende/programar.md
      - Variables y tipos: aprende/variables.md
      - Funciones: aprende/funciones.md
      - ¿Qué es aprender de datos?: aprende/aprender-de-datos.md
      - ¿Qué es una neurona?: aprende/neuronas.md
  - Tutorial:
      - Instalación: getting-started/installation.md
      - Tu primer programa: getting-started/first-program.md
      - Ejemplos básicos: getting-started/basic-examples.md
      - El lenguaje paso a paso:
          - Estructura léxica: language/lexical-structure.md
          - Sistema de tipos: language/type-system.md
          - Operadores y expresiones: language/operators.md
          - Estructuras de control: language/control-structures.md
          - Funciones: language/functions.md
          - Listas: language/lists.md
          - Imports: language/imports.md
  - Librerías:
      - MATH (matemáticas):
