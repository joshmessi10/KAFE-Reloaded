          - Constantes: libraries/math/constants.md
          - Redondeo: libraries/math/rounding.md
          - Potencias y raíces: libraries/math/powers.md
          - Logaritmos: libraries/math/logarithms.md
          - Restos y divisores: libraries/math/division.md
          - Trigonometría: libraries/math/trigonometry.md
          - Hiperbólicas: libraries/math/hyperbolic.md
          - Combinatoria: libraries/math/combinatorics.md
          - Listas de números: libraries/math/lists.md
