          - Crear y leer tablas: libraries/pardos/tables.md
          - Mirar los datos: libraries/pardos/inspect.md
          - Elegir columnas y filas: libraries/pardos/select.md
          - Contar y resumir: libraries/pardos/summarize.md
          - Datos que faltan: libraries/pardos/missing.md
          - Juntar tablas: libraries/pardos/combine.md
          - Guardar tablas: libraries/pardos/save.md
