[project]
name = "kafe-reloaded"
version = "0.0.0"  # uv requires a version; package=false keeps this project unpublished.
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime==4.13.2",
]

[project.optional-dependencies]
huggingface = ["datasets"]

[dependency-groups]
dev = [
    "basedpyright",
    "codespell",
    "pytest>=9.0.2",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.coverage.run]
branch = false
source = ["src"]
patch = ["subprocess"]
omit = [
    "*/Kafe_GrammarLexer.py",
    "*/Kafe_GrammarParser.py",
    "*/Kafe_GrammarVisitor.py",
]

[tool.coverage.report]
fail_under = 80
include_namespace_packages = true
show_missing = true

[tool.ruff]
target-version = "py310"
force-exclude = true
extend-exclude = [
    "src/Kafe_GrammarLexer.py",
    "src/Kafe_GrammarParser.py",
    "src/Kafe_GrammarVisitor.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
failOnWarnings = true
ignore = [
    "src/Kafe_GrammarLexer.py",
    "src/Kafe_GrammarParser.py",
    "src/Kafe_GrammarVisitor.py",
]

[tool.codespell]
check-hidden = true
ignore-words-list = "expec,mape,MAPE,FPR,Hart,le"
skip = ".git,.venv,.superpowers,./docs/superpowers/*,.\\docs\\superpowers\\*,site,.pytest_cache,.ruff_cache,__pycache__,.coverage,htmlcov,*.cover,*.interp,*.tokens,Kafe_GrammarLexer.py,Kafe_GrammarParser.py,Kafe_GrammarVisitor.py,output.txt,temp_output.txt,archivo_*.txt"
