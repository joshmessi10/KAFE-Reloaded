<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-pca-t ill-pca-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-pca-t">PCA busca la dirección más ancha y proyecta la sombra / PCA finds the widest direction and casts the shadow</title>
<desc id="ill-pca-d">Four points on a grid. A line turns until it points along the diagonal, where the points are most spread out. Each point drops a shadow onto the line, and the shadows become a single row of numbers: −2.12, 0, 0 and 2.12.</desc>
<style>
@keyframes ill-pca-turn { 0%,12% { transform: rotate(45deg) } 45%,100% { transform: rotate(0deg) } }
.ill-pca-turn { transform-box: view-box; transform-origin: 232.5px 132.5px; animation: ill-pca-turn 10s ease-in-out infinite; }
@keyframes ill-pca-shadow { 0%,50% { opacity: 0 } 60%,100% { opacity: 1 } }
.ill-pca-shadow { animation: ill-pca-shadow 10s linear infinite; }
@keyframes ill-pca-line1d { 0%,65% { opacity: 0 } 75%,100% { opacity: 1 } }
.ill-pca-line1d { animation: ill-pca-line1d 10s linear infinite; }
@keyframes ill-pca-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-pca-all { animation: ill-pca-all 10s linear infinite; }
.ill-pca-dash { stroke-dasharray: 6 5; }
</style>
<path class="k-line" d="M120 20 V245 H360"/>
<g class="ill-pca-all">
<g class="ill-pca-turn"><line class="k-accent-line" x1="126.43398282201787" y1="238.56601717798213" x2="338.56601717798213" y2="26.433982822017867"/></g>
<circle class="k-fill" cx="165" cy="200" r="8"/><circle class="k-fill" cx="210" cy="110" r="8"/><circle class="k-fill" cx="255" cy="155" r="8"/><circle class="k-fill" cx="300" cy="65" r="8"/>
<g class="ill-pca-shadow"><line class="k-thin" x1="165" y1="200" x2="165.0" y2="200.0"/><circle class="k-accent" cx="165.0" cy="200.0" r="5"/><line class="k-thin" x1="210" y1="110" x2="232.5" y2="132.5"/><circle class="k-accent" cx="232.5" cy="132.5" r="5"/><line class="k-thin" x1="255" y1="155" x2="232.5" y2="132.5"/><circle class="k-accent" cx="232.5" cy="132.5" r="5"/><line class="k-thin" x1="300" y1="65" x2="300.0" y2="65.0"/><circle class="k-accent" cx="300.0" cy="65.0" r="5"/></g>
<g class="ill-pca-line1d"><path class="k-line" d="M390 140 H580"/><circle class="k-accent" cx="400.1" cy="140" r="6"/><circle class="k-accent" cx="485.0" cy="140" r="6"/><circle class="k-accent" cx="485.0" cy="140" r="6"/><circle class="k-accent" cx="569.9" cy="140" r="6"/><text x="386" y="166">-2.12</text><text x="556" y="166">2.12</text></g>
</g>
</svg>
