<title id="ill-gnb-t">Dos campanas: ¿cuál es más alta en 6? / Two bells: which is taller at 6?</title>
<desc id="ill-gnb-d">A narrow bell centred at 4 for cats and a wide, low bell centred at 10 for dogs. A vertical line at weight 6 shows the dog bell (0.052) is taller there than the cat bell (0.024), even though 6 is closer to 4.</desc>
