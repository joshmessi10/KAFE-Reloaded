<svg viewBox="0 0 560 260" role="img" aria-labelledby="ill-nn-t ill-nn-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-nn-t">Una neurona suma sus entradas con pesos / A neuron adds its weighted inputs</title>
<desc id="ill-nn-d">Three inputs on the left connect to a large circle with a sum sign. The lines have different thickness: the thicker the line, the larger the weight. Signals travel along the lines, the neuron lights up and sends an output of 1.</desc>
<style>
@keyframes ill-nn-flow { 0%,10% { stroke-dashoffset: 40 } 45% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0 } }
@keyframes ill-nn-sig { 0%,8% { opacity: 0 } 12%,40% { opacity: 1 } 45%,100% { opacity: 0 } }
@keyframes ill-nn-glow { 0%,42% { opacity: 0 } 52%,85% { opacity: 1 } 100% { opacity: 0 } }
@keyframes ill-nn-out { 0%,55% { opacity: 0; transform: translateX(-20px) } 65%,88% { opacity: 1; transform: translateX(0) } 100% { opacity: 0 } }
.ill-nn-sig { stroke-dasharray: 10 30; animation: ill-nn-flow 5s linear infinite, ill-nn-sig 5s linear infinite; }
.ill-nn-glow { animation: ill-nn-glow 5s ease-in-out infinite; }
.ill-nn-out { animation: ill-nn-out 5s ease-out infinite; }
</style>
<circle class="k-line" cx="70" cy="60" r="26"/><text class="k-label" x="58" y="66" font-size="18">x₁</text>
<circle class="k-line" cx="70" cy="130" r="26"/><text class="k-label" x="58" y="136" font-size="18">x₂</text>
<circle class="k-line" cx="70" cy="200" r="26"/><text class="k-label" x="58" y="206" font-size="18">x₃</text>
<path class="k-line" style="stroke-width:3" d="M96 64 L262 120"/>
<path class="k-line" style="stroke-width:8" d="M96 130 L260 130"/>
<path class="k-line" style="stroke-width:5" d="M96 196 L262 140"/>
<text x="150" y="80" font-size="13">w₁</text><text x="160" y="122" font-size="13">w₂</text><text x="150" y="190" font-size="13">w₃</text>
<path class="k-accent-line ill-nn-sig" style="stroke-width:6" d="M96 64 L262 120"/>
<path class="k-accent-line ill-nn-sig" style="stroke-width:6" d="M96 130 L260 130"/>
<path class="k-accent-line ill-nn-sig" style="stroke-width:6" d="M96 196 L262 140"/>
<circle class="k-accent ill-nn-glow" cx="320" cy="130" r="62" opacity="0.35"/>
<circle class="k-paper" cx="320" cy="130" r="52"/>
<circle class="k-line" cx="320" cy="130" r="52"/>
<text class="k-label" x="303" y="142" font-size="34">Σ</text>
<path class="k-line" d="M372 130 H420"/>
<path class="k-thin" d="M424 160 H446 L462 100 H486"/>
<g class="ill-nn-out"><path class="k-accent-line" d="M494 130 H530 M518 118 L532 130 L518 142"/><text class="k-label" x="500" y="116" font-size="22">1</text></g>
</svg>
