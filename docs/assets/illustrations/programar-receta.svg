<svg viewBox="0 0 540 230" role="img" aria-labelledby="ill-prog-t ill-prog-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-prog-t">Un programa se ejecuta línea por línea / A program runs line by line</title>
<desc id="ill-prog-d">A program with three numbered lines on the left. A highlight moves from line 1 to line 3, and each time a result appears on the screen on the right.</desc>
<style>
@keyframes ill-prog-hl { 0%,28% { transform: translateY(0) } 33%,61% { transform: translateY(46px) } 66%,94% { transform: translateY(92px) } 100% { transform: translateY(0) } }
@keyframes ill-prog-o1 { 0%,8% { opacity: 0 } 13%,95% { opacity: 1 } 100% { opacity: 0 } }
@keyframes ill-prog-o2 { 0%,41% { opacity: 0 } 46%,95% { opacity: 1 } 100% { opacity: 0 } }
@keyframes ill-prog-o3 { 0%,74% { opacity: 0 } 79%,95% { opacity: 1 } 100% { opacity: 0 } }
@keyframes ill-prog-arrow { 0%,100% { transform: translateX(0) } 50% { transform: translateX(8px) } }
.ill-prog-hl { animation: ill-prog-hl 7s ease-in-out infinite; }
.ill-prog-o1 { animation: ill-prog-o1 7s linear infinite; }
.ill-prog-o2 { animation: ill-prog-o2 7s linear infinite; }
.ill-prog-o3 { animation: ill-prog-o3 7s linear infinite; }
.ill-prog-arrow { animation: ill-prog-arrow 1.4s ease-in-out infinite; }
</style>
