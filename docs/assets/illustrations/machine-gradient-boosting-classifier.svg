.ill-gbc-d2 { transform: translateX(0.0px); animation: ill-gbc-d2 14s ease-in-out infinite; }
@keyframes ill-gbc-d3 { 0% { transform: translateX(63.0px); } 8%,24% { transform: translateX(63.0px); } 28%,44% { transform: translateX(71.4px); } 48%,64% { transform: translateX(84.0px); } 68%,100% { transform: translateX(0.0px); } }
.ill-gbc-d3 { transform: translateX(0.0px); animation: ill-gbc-d3 14s ease-in-out infinite; }
@keyframes ill-gbc-d4 { 0% { transform: translateX(-205.8px); } 8%,24% { transform: translateX(-205.8px); } 28%,44% { transform: translateX(-172.2px); } 48%,64% { transform: translateX(-134.4px); } 68%,100% { transform: translateX(0.0px); } }
.ill-gbc-d4 { transform: translateX(0.0px); animation: ill-gbc-d4 14s ease-in-out infinite; }
@keyframes ill-gbc-d5 { 0% { transform: translateX(-180.6px); } 8%,24% { transform: translateX(-180.6px); } 28%,44% { transform: translateX(-172.2px); } 48%,64% { transform: translateX(-134.4px); } 68%,100% { transform: translateX(0.0px); } }
.ill-gbc-d5 { transform: translateX(0.0px); animation: ill-gbc-d5 14s ease-in-out infinite; }
@keyframes ill-gbc-n0 { 0%,5% { opacity: 0 } 8%,24% { opacity: 1 } 27%,100% { opacity: 0 } }
.ill-gbc-n0 { opacity: 0; animation: ill-gbc-n0 14s linear infinite; }
@keyframes ill-gbc-n1 { 0%,25% { opacity: 0 } 28%,44% { opacity: 1 } 47%,100% { opacity: 0 } }
.ill-gbc-n1 { opacity: 0; animation: ill-gbc-n1 14s linear infinite; }
@keyframes ill-gbc-n2 { 0%,45% { opacity: 0 } 48%,64% { opacity: 1 } 67%,100% { opacity: 0 } }
.ill-gbc-n2 { opacity: 0; animation: ill-gbc-n2 14s linear infinite; }
@keyframes ill-gbc-n3 { 0%,65% { opacity: 0 } 68%,100% { opacity: 1 } }
.ill-gbc-n3 { animation: ill-gbc-n3 14s linear infinite; }
@keyframes ill-gbc-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
