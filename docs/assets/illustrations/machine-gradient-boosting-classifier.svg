<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-gbc-t ill-gbc-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-gbc-t">Las probabilidades se separan árbol a árbol / Probabilities drift apart tree by tree</title>
<desc id="ill-gbc-d">Six days on a probability-of-rain axis. All start at 0.33. After 1, 3 and 20 trees the four dry days drift left towards 0.11 to 0.18 and the two rainy days drift right past one half, to 0.82 and 0.76.</desc>
<style>
