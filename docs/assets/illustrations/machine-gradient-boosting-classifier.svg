.ill-gbc-d0 { transform: translateX(0.0px); animation: ill-gbc-d0 14s ease-in-out infinite; }
@keyframes ill-gbc-d1 { 0% { transform: translateX(92.4px); } 8%,24% { transform: translateX(92.4px); } 28%,44% { transform: translateX(79.8px); } 48%,64% { transform: translateX(54.6px); } 68%,100% { transform: translateX(0.0px); } }
.ill-gbc-d1 { transform: translateX(0.0px); animation: ill-gbc-d1 14s ease-in-out infinite; }
