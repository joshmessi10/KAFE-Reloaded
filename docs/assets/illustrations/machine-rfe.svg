<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-rfe-t ill-rfe-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-rfe-t">RFE quita la columna con el peso más pequeño / RFE removes the column with the smallest weight</title>
<desc id="ill-rfe-d">Three bars show how much a linear model relies on each column: 2.00, 0.00 and 3.00. The column with the smallest weight, x1, is crossed out, and the ranking shows the kept columns as 1 and the removed one as 3.</desc>
<style>
@keyframes ill-rfe-x { 0%,40% { opacity: 0 } 50%,100% { opacity: 1 } }
.ill-rfe-x { animation: ill-rfe-x 10s linear infinite; }
@keyframes ill-rfe-rank { 0%,60% { opacity: 0 } 70%,100% { opacity: 1 } }
.ill-rfe-rank { animation: ill-rfe-rank 10s linear infinite; }
@keyframes ill-rfe-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-rfe-all { animation: ill-rfe-all 10s linear infinite; }
.ill-rfe-dash { stroke-dasharray: 6 5; }
</style>
<path class="k-line" d="M80 220 H520"/>
<g class="ill-rfe-all">
<rect class="k-accent" x="130" y="93.3" width="70" height="126.7"/><text class="k-label" x="150" y="245">x0</text><text x="144" y="85">2.00</text><rect class="k-accent" x="260" y="200.0" width="70" height="20.0"/><text class="k-label" x="280" y="245">x1</text><text x="274" y="192">0.00</text><rect class="k-accent" x="390" y="40.0" width="70" height="180.0"/><text class="k-label" x="410" y="245">x2</text><text x="404" y="32">3.00</text><g class="ill-rfe-x"><path class="k-line" d="M254 120 l82 90 m0 -90 l-82 90"/></g><g class="ill-rfe-rank"><text class="k-label" x="200" y="34">ranking_ = [1, 3, 1]</text></g>
</g>
</svg>
