<svg viewBox="0 0 560 240" role="img" aria-labelledby="ill-l2v-t ill-l2v-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-l2v-t">Un bucle es como dar vueltas a una pista / A loop is like running laps on a track</title>
<desc id="ill-l2v-d">A runner goes around a round track three times. A counter next to the track shows 1, 2 and 3, and the runner stops when the condition # &lt;= 3 is no longer true.</desc>
<style>
@keyframes ill-l2v-run { 0% { transform: rotate(0deg) } 25% { transform: rotate(360deg) } 50% { transform: rotate(720deg) } 75%,100% { transform: rotate(1080deg) } }
@keyframes ill-l2v-one { 0%,24% { opacity: 1 } 25%,100% { opacity: 0 } }
@keyframes ill-l2v-two { 0%,24% { opacity: 0 } 25%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
@keyframes ill-l2v-three { 0%,49% { opacity: 0 } 50%,100% { opacity: 1 } }
@keyframes ill-l2v-flag { 0%,74% { opacity: 0 } 76%,100% { opacity: 1 } }
.ill-l2v-runner { transform-box: view-box; transform-origin: 170px 120px; animation: ill-l2v-run 8s linear infinite; }
.ill-l2v-one { opacity: 0; animation: ill-l2v-one 8s step-end infinite; }
.ill-l2v-two { opacity: 0; animation: ill-l2v-two 8s step-end infinite; }
.ill-l2v-three { animation: ill-l2v-three 8s step-end infinite; }
.ill-l2v-flag { animation: ill-l2v-flag 8s step-end infinite; }
</style>
<circle class="k-soft" cx="170" cy="120" r="95"/>
<circle class="k-line" cx="170" cy="120" r="95"/>
<circle class="k-paper" cx="170" cy="120" r="65"/>
<circle class="k-line" cx="170" cy="120" r="65"/>
<circle class="k-thin" cx="170" cy="120" r="80" stroke-dasharray="6 8"/>
<path class="k-accent-line" d="M170 18 V58"/>
<g class="ill-l2v-runner"><circle class="k-accent" cx="170" cy="40" r="11"/><circle class="k-fill" cx="170" cy="40" r="4"/></g>
<text x="128" y="126" font-size="15">while</text>
<rect class="k-line" x="330" y="60" width="150" height="110" rx="12"/>
<text x="348" y="88" font-size="15">#</text>
<text class="k-label ill-l2v-one" x="390" y="148" font-size="48">1</text>
<text class="k-label ill-l2v-two" x="390" y="148" font-size="48">2</text>
<text class="k-label ill-l2v-three" x="390" y="148" font-size="48">3</text>
<g class="ill-l2v-flag"><path class="k-line" d="M500 170 V70"/><path class="k-accent" d="M502 72 H540 L528 86 L540 100 H502 Z"/></g>
<text x="352" y="205" font-size="15"># &lt;= 3</text>
</svg>
