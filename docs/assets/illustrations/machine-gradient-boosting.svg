<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-gbr-t ill-gbr-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-gbr-t">Cada árbol corrige un poco lo que falta / Each tree fixes a bit of what is left</title>
<desc id="ill-gbr-d">Four flats priced 10, 20, 30 and 40. The prediction bars start flat at the average, 25. After 1, 2, 5 and 50 trees they move step by step towards each point: 20 and 30, then 15 and 31.67, then 11.46 and 38.4, and finally they land on 10, 20, 30 and 40.</desc>
