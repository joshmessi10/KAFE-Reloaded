<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-var-t ill-var-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-var-t">VarianceThreshold quita las columnas que casi no cambian / VarianceThreshold drops columns that barely change</title>
<desc id="ill-var-d">Three bars show the variance of three columns: 0, 0.125 and 5. A dashed threshold line at 0 crosses out the first column, which never changes. Then the line rises to 0.5 and also crosses out the second, leaving only the third.</desc>
<style>
@keyframes ill-var-th { 0%,15% { transform: translateY(0) } 25%,50% { transform: translateY(0) } 70%,100% { transform: translateY(-49.5px) } }
.ill-var-th { transform: translateY(-49.5px); animation: ill-var-th 12s ease-in-out infinite; }
@keyframes ill-var-x0 { 0%,25% { opacity: 0 } 32%,100% { opacity: 1 } }
.ill-var-x0 { animation: ill-var-x0 12s linear infinite; }
@keyframes ill-var-x1 { 0%,72% { opacity: 0 } 80%,100% { opacity: 1 } }
.ill-var-x1 { animation: ill-var-x1 12s linear infinite; }
@keyframes ill-var-t0 { 0%,15% { opacity: 1 } 22%,100% { opacity: 0 } }
.ill-var-t0 { opacity: 0; animation: ill-var-t0 12s linear infinite; }
@keyframes ill-var-t1 { 0%,55% { opacity: 0 } 62%,100% { opacity: 1 } }
.ill-var-t1 { animation: ill-var-t1 12s linear infinite; }
@keyframes ill-var-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-var-all { animation: ill-var-all 12s linear infinite; }
.ill-var-dash { stroke-dasharray: 6 5; }
</style>
<path class="k-line" d="M80 220 H520"/>
<g class="ill-var-all">
<rect class="k-accent" x="130" y="200.0" width="70" height="20.0"/><text x="150" y="245">0.0</text><g class="ill-var-x0"><rect class="k-paper" x="126" y="196.0" width="78" height="24.0" opacity="0.7"/><path class="k-line" d="M140 165.0 l50 30 m0 -30 l-50 30"/></g><rect class="k-accent" x="260" y="175.3" width="70" height="44.7"/><text x="280" y="245">0.125</text><g class="ill-var-x1"><rect class="k-paper" x="256" y="171.3" width="78" height="48.7" opacity="0.7"/><path class="k-line" d="M270 140.3 l50 30 m0 -30 l-50 30"/></g><rect class="k-accent" x="390" y="43.5" width="70" height="176.5"/><text x="410" y="245">5.0</text><g class="ill-var-th"><line class="k-line ill-var-dash" x1="90" y1="200" x2="520" y2="200"/><text class="k-label ill-var-t0" x="526" y="205">0</text><text class="k-label ill-var-t1" x="526" y="205">0.5</text></g>
</g>
</svg>
