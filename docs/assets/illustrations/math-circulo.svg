<svg viewBox="0 0 580 230" role="img" aria-labelledby="ill-sin-t ill-sin-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-sin-t">El seno es la altura de un punto que gira / Sine is the height of a turning point</title>
<desc id="ill-sin-d">A point turns around a circle of radius 1. Its height goes up and down between 1 and -1, and that height, drawn over time, makes the sine wave on the right.</desc>
<style>
@keyframes ill-sin-turn { from { transform: rotate(0deg) } to { transform: rotate(-360deg) } }
@keyframes ill-sin-wave { from { transform: translateX(0) } to { transform: translateX(-200px) } }
@keyframes ill-sin-dot { 0% { transform: translateY(0); animation-timing-function: ease-out } 25% { transform: translateY(-80px); animation-timing-function: ease-in } 50% { transform: translateY(0); animation-timing-function: ease-out } 75% { transform: translateY(80px); animation-timing-function: ease-in } 100% { transform: translateY(0) } }
.ill-sin-arm { transform-origin: 110px 115px; animation: ill-sin-turn 6s linear infinite; }
.ill-sin-wave { animation: ill-sin-wave 6s linear infinite; }
.ill-sin-dot { animation: ill-sin-dot 6s infinite; }
</style>
<defs><clipPath id="ill-sin-clip"><rect x="270" y="20" width="290" height="200"/></clipPath></defs>
<circle class="k-line" cx="110" cy="115" r="80"/>
<path class="k-thin" d="M20 115 H200 M110 25 V205"/>
<text x="196" y="108">1</text><text x="114" y="30">1</text>
<g class="ill-sin-arm"><path class="k-accent-line" d="M110 115 H190"/><circle class="k-accent" cx="190" cy="115" r="8"/></g>
<path class="k-thin" d="M270 115 H560"/>
<path class="k-thin" d="M290 35 H560 M290 195 H560" stroke-dasharray="4 6"/>
<text x="270" y="40">1</text><text x="262" y="200">-1</text>
