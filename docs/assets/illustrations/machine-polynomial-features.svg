<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-poly-t ill-poly-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-poly-t">Agregar x² deja que una recta dibuje una curva / Adding x² lets a straight-line model draw a curve</title>
<desc id="ill-poly-d">Squares of side 1 to 4 with areas 1, 4, 9 and 16 lie on a curve. A straight line, dashed, cannot follow them. When a new column with x squared is added, the same linear model draws a curve that passes through every point.</desc>
<style>
@keyframes ill-poly-cols { 0%,40% { opacity: 0 } 48%,100% { opacity: 1 } }
.ill-poly-cols { animation: ill-poly-cols 10s linear infinite; }
@keyframes ill-poly-curve { 0%,55% { opacity: 0 } 68%,100% { opacity: 1 } }
.ill-poly-curve { animation: ill-poly-curve 10s linear infinite; }
@keyframes ill-poly-out { 0%,35% { opacity: 1 } 45%,100% { opacity: 0 } }
.ill-poly-out { opacity: 0; animation: ill-poly-out 10s linear infinite; }
@keyframes ill-poly-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-poly-all { animation: ill-poly-all 10s linear infinite; }
.ill-poly-dash { stroke-dasharray: 6 5; }
</style>
<path class="k-line" d="M80 20 V235 H500"/><text x="166" y="256">1</text><text x="256" y="256">2</text><text x="346" y="256">3</text><text x="436" y="256">4</text>
<g class="ill-poly-all">
<g class="ill-poly-out"><line class="k-line ill-poly-dash" x1="170" y1="235" x2="476.00000000000006" y2="48"/></g>
