<svg viewBox="0 0 560 210" role="img" aria-labelledby="ill-tsc-t ill-tsc-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-tsc-t">Escribir, guardar, ejecutar, leer / Write, save, run, read</title>
<desc id="ill-tsc-d">Four stations in a row: a page where lines of code are written, a disk that saves the .kf file, a terminal that runs the program, and a screen where the result appears. A highlight moves from one station to the next and then starts again.</desc>
<style>
@keyframes ill-tsc-hl { 0%,20% { transform: translateX(0) } 25%,45% { transform: translateX(140px) } 50%,70% { transform: translateX(280px) } 75%,95% { transform: translateX(420px) } 100% { transform: translateX(0) } }
@keyframes ill-tsc-w1 { 0%,2% { transform: scaleX(0) } 10%,100% { transform: scaleX(1) } }
@keyframes ill-tsc-w2 { 0%,9% { transform: scaleX(0) } 18%,100% { transform: scaleX(1) } }
@keyframes ill-tsc-sv { 0%,27% { opacity: 0 } 32%,100% { opacity: 1 } }
@keyframes ill-tsc-run { 0%,52% { opacity: 0 } 57%,100% { opacity: 1 } }
@keyframes ill-tsc-out { 0%,77% { opacity: 0 } 82%,96% { opacity: 1 } 100% { opacity: 0 } }
.ill-tsc-hl { animation: ill-tsc-hl 8s ease-in-out infinite; }
.ill-tsc-w1 { transform-box: fill-box; transform-origin: left; animation: ill-tsc-w1 8s linear infinite; }
.ill-tsc-w2 { transform-box: fill-box; transform-origin: left; animation: ill-tsc-w2 8s linear infinite; }
.ill-tsc-sv { animation: ill-tsc-sv 8s linear infinite; }
.ill-tsc-run { animation: ill-tsc-run 8s linear infinite; }
.ill-tsc-out { animation: ill-tsc-out 8s linear infinite; }
</style>
