<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-enet-t ill-enet-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-enet-t">Con datos gemelos, ElasticNet reparte el peso / With twin data, ElasticNet shares the weight</title>
<desc id="ill-enet-d">Two identical columns of data, x1 and x2. Lasso gives all the weight, 1.9, to x1 and 0 to x2. ElasticNet then splits it evenly: 0.95 and 0.95.</desc>
<style>
@keyframes ill-enet-a { 0%,30% { transform: scaleY(1) } 55%,100% { transform: scaleY(0.5) } }
@keyframes ill-enet-b { 0%,30% { transform: scaleY(0) } 55%,100% { transform: scaleY(0.5) } }
@keyframes ill-enet-l { 0%,35% { opacity: 1 } 42%,100% { opacity: 0 } }
@keyframes ill-enet-e { 0%,45% { opacity: 0 } 52%,100% { opacity: 1 } }
@keyframes ill-enet-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-enet-all { animation: ill-enet-all 10s linear infinite; }
.ill-enet-a { transform-box: view-box; transform-origin: 300px 220px; transform: scaleY(0.5); animation: ill-enet-a 10s ease-in-out infinite; }
.ill-enet-b { transform-box: view-box; transform-origin: 440px 220px; transform: scaleY(0.5); animation: ill-enet-b 10s ease-in-out infinite; }
.ill-enet-l { opacity: 0; animation: ill-enet-l 10s linear infinite; }
.ill-enet-e { animation: ill-enet-e 10s linear infinite; }
</style>
<text class="k-label" x="60" y="40">x₁</text><text class="k-label" x="130" y="40">x₂</text>
<rect class="k-soft" x="50" y="52" width="130" height="168" rx="6"/>
<text x="70" y="80">1</text><text x="140" y="80">1</text>
<text x="70" y="112">2</text><text x="140" y="112">2</text>
<text x="70" y="144">3</text><text x="140" y="144">3</text>
<text x="70" y="176">4</text><text x="140" y="176">4</text>
<text x="70" y="208">5</text><text x="140" y="208">5</text>
<path class="k-line" d="M240 220 H520"/>
<text class="k-label" x="290" y="248">w₁</text><text class="k-label" x="430" y="248">w₂</text>
<g class="ill-enet-all">
<rect class="k-thin" x="270" y="60" width="60" height="160" rx="3"/>
<rect class="k-accent ill-enet-a" x="270" y="60" width="60" height="160"/>
<rect class="k-thin" x="410" y="60" width="60" height="160" rx="3"/>
<rect class="k-accent ill-enet-b" x="410" y="60" width="60" height="160"/>
<g class="ill-enet-l"><text class="k-label" x="340" y="34">Lasso</text><text x="288" y="50">1.9</text><text x="434" y="50">0</text></g>
<g class="ill-enet-e"><text class="k-label" x="322" y="34">ElasticNet</text><text x="282" y="50">0.95</text><text x="422" y="50">0.95</text></g>
</g>
</svg>
