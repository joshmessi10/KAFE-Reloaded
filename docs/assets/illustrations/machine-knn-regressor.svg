<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-knr-t ill-knr-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-knr-t">El precio es el promedio de los 2 vecinos / The price is the average of the 2 neighbours</title>
<desc id="ill-knr-d">Five flats by size and price. A dashed line marks a new flat of 42 square metres, its two nearest neighbours (40 and 50) get rings, and the prediction appears halfway between their prices: 15.5.</desc>
<style>
@keyframes ill-knr-probe { 0%,10% { opacity: 0 } 20%,100% { opacity: 1 } }
.ill-knr-probe { animation: ill-knr-probe 10s linear infinite; }
@keyframes ill-knr-near { 0%,30% { opacity: 0 } 40%,100% { opacity: 1 } }
.ill-knr-near { animation: ill-knr-near 10s linear infinite; }
@keyframes ill-knr-avg { 0%,55% { opacity: 0 } 65%,100% { opacity: 1 } }
.ill-knr-avg { animation: ill-knr-avg 10s linear infinite; }
.ill-knr-dash { stroke-dasharray: 6 6; }
@keyframes ill-knr-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-knr-all { animation: ill-knr-all 10s linear infinite; }
</style>
<path class="k-line" d="M60 20 V230 H500"/>
<text x="117.0" y="252">30</text><text x="182.0" y="252">40</text><text x="247.0" y="252">50</text><text x="312.0" y="252">60</text><text x="442.0" y="252">80</text>
<g class="ill-knr-all">
<circle class="k-fill" cx="125.0" cy="165.0" r="7"/><circle class="k-fill" cx="190.0" cy="139.0" r="7"/><circle class="k-fill" cx="255.0" cy="119.5" r="7"/><circle class="k-fill" cx="320.0" cy="93.5" r="7"/><circle class="k-fill" cx="450.0" cy="48.0" r="7"/>
<g class="ill-knr-probe"><line class="k-thin ill-knr-dash" x1="203.0" y1="230" x2="203.0" y2="40"/><text class="k-label" x="193.0" y="34">42</text></g>
<g class="ill-knr-near"><circle class="k-accent-line" cx="190.0" cy="139.0" r="13"/><circle class="k-accent-line" cx="255.0" cy="119.5" r="13"/></g>
<g class="ill-knr-avg"><line class="k-thin" x1="190.0" y1="139.0" x2="255.0" y2="119.5"/><circle class="k-accent" cx="203.0" cy="129.25" r="8"/><text class="k-label" x="143.0" y="115.25">15.5</text></g>
</g>
</svg>
