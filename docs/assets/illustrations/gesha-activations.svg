@keyframes ill-act-sig { 0%,5% { opacity: 0 } 15%,100% { opacity: 1 } }
.ill-act-sig { animation: ill-act-sig 10s linear infinite; }
@keyframes ill-act-tanh { 0%,25% { opacity: 0 } 35%,100% { opacity: 1 } }
.ill-act-tanh { animation: ill-act-tanh 10s linear infinite; }
@keyframes ill-act-relu { 0%,45% { opacity: 0 } 55%,100% { opacity: 1 } }
.ill-act-relu { animation: ill-act-relu 10s linear infinite; }
@keyframes ill-act-pts { 0%,65% { opacity: 0 } 75%,100% { opacity: 1 } }
.ill-act-pts { animation: ill-act-pts 10s linear infinite; }
@keyframes ill-act-all { 0% { opacity: 0 } 4%,94% { opacity: 1 } 100% { opacity: 0 } }
.ill-act-all { animation: ill-act-all 10s linear infinite; }
.ill-act-dash { stroke-dasharray: 6 5; }
</style>
