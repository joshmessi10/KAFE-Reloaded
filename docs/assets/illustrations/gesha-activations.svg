<svg viewBox="0 0 600 270" role="img" aria-labelledby="ill-act-t ill-act-d" xmlns="http://www.w3.org/2000/svg">
<title id="ill-act-t">Tres funciones de activación / Three activation functions</title>
<desc id="ill-act-d">Three curves draw one after another: sigmoid, an S between 0 and 1; tanh, an S between −1 and 1; and ReLU, flat at 0 for negative inputs and a straight line for positive ones. Dots mark sigmoid and tanh at −2, 0 and 2.</desc>
